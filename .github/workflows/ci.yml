name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The whole suite on every platform we claim to support. The end-to-end
  # tests (tests/e2e_*.rs) run the events example inside a real pseudo
  # terminal: ConPTY on Windows, a pty on Linux and macOS.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets
      - run: cargo test --all-targets
      - run: cargo test --doc
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The oldest compiler we promise to support (rust-version in Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.70"
      - run: cargo check --lib --examples
