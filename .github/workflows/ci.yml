name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The whole suite on every platform we claim to support. The end-to-end
  # tests (tests/e2e_*.rs) run the events example inside a real pseudo
  # terminal: ConPTY on Windows, a pty on Linux and macOS.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets
      - run: cargo test --all-targets
      - run: cargo test --doc
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The oldest compiler we promise to support (rust-version in Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.70"
      - run: cargo check --lib --examples

  # Publishes to crates.io when master has a version that is not yet released.
  # To release: bump `version` in Cargo.toml in your PR. Merges that leave the
  # version unchanged skip publishing, so this never fails on re-runs.
  #
  # The token must be a repository SECRET named CARGO_REGISTRY_TOKEN (Settings,
  # Secrets and variables, Actions, Secrets). A plain variable is not enough:
  # variables are not masked in logs.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, msrv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check whether this version is already published
        id: version
        run: |
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "$name-ci (github.com/${{ github.repository }})" \
            "https://crates.io/api/v1/crates/$name/$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$status" = "200" ]; then
            echo "$name $version is already on crates.io, skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "unexpected crates.io status $status" >&2
            exit 1
          fi
      - name: Publish
        id: publish
        if: steps.version.outputs.publish == 'true'
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set as a repository secret, so ${{ steps.version.outputs.version }} was not published. Add it as a secret (not a variable) and re-run this job."
            exit 0
          fi
          cargo publish
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Tag release
        if: steps.publish.outputs.published == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
